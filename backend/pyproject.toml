[project]
name = "themis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "paho-mqtt>=1.6,<2.0",
    "websocket-client>=1.7",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# greenlet: SQLAlchemy's async layer runs sync code inside greenlets; without this coverage.py drops
# every line executed after the first `await session.execute(...)` and under-reports by ~12 points.
[tool.coverage.run]
branch = true
source = ["app"]
concurrency = ["greenlet", "thread"]

# fail_under is a ratchet: measured 80% (line+branch) when it was set, floor left 2 points below for
# interpreter/version noise. Raise it as coverage grows; never lower it to make a change pass.
[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 78

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
