[project]
name = "themis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "paho-mqtt>=1.6,<2.0",
    "websocket-client>=1.7",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff~=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "shipped_defaults: keep the real plugin defaults.toml (the suite blanks the Laminus URL default so slicing is unconfigured unless a test configures it)",
    "auto_test: run the real background connection test a printer create/edit schedules (the suite records it instead)",
    "real_protocol: manual checks against a real printer (backend/protocol_verification); never part of the normal gates",
]

# greenlet: SQLAlchemy's async layer runs sync code inside greenlets; without this coverage.py drops
# every line executed after the first `await session.execute(...)` and under-reports by ~12 points.
[tool.coverage.run]
branch = true
source = ["app"]
concurrency = ["greenlet", "thread"]

# fail_under is a ratchet: measured 92.9% (line+branch, 2026-10-15 after BIZ-294 model slicer profiles), floor left ~1 point below for
# interpreter/version noise. Raise it as coverage grows; never lower it to make a change pass.
[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["plugins/*/themis-plugin.toml", "plugins/*/defaults.toml"]

# Lint: pyflakes + pycodestyle errors only (ruff's default set). Widen deliberately, not by accident.
[tool.ruff]
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Style-only rules the codebase never followed; correctness rules (F, E9) stay on.
ignore = ["E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are imported then taken as same-named test args (F811); tests set up sys.path/env before importing the app (E402).
"tests/**" = ["F811", "E402"]
# Env/logging setup deliberately precedes the app imports.
"app/main.py" = ["E402"]
