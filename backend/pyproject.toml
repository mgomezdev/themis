[project]
name = "themis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "paho-mqtt>=1.6,<2.0",
    "websocket-client>=1.7",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# anyio's pytest plugin (a transitive dep of starlette/httpx) fights pytest-asyncio's
# asyncio_mode=auto for control of async test execution. Which one "wins" depends on
# importlib.metadata entry-point enumeration order, which is not stable across separate
# venvs/pip installs — in a bad order it causes the in-memory SQLite fixture's connection
# to run under an event loop the test body doesn't share, dropping the schema mid-test
# ("no such table"). Disable the plugin outright; nothing here uses anyio's own test marker.
addopts = "-p no:anyio"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
