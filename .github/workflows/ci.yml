name: ci

# Gates every feature/* -> develop pull request. Until this existed, none of the
# repo's 745 backend tests or 42 frontend test files ran in CI at all -- the only
# workflow triggered on push to main, after the merge it should have gated.
#
# Cross-service coverage is delegated to Concordia's reusable e2e workflow, which
# runs inside this workflow run so its result blocks this pull request directly.

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e "backend[dev]"

      # No services needed: backend/tests/conftest.py runs against in-memory
      # SQLite over an ASGI transport, so there is no DB, network or sidecar.
      - name: Run backend tests
        working-directory: backend
        run: pytest -v -ra

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run lint` is deliberately absent: package.json declares the script
      # and the ESLint 9 dependencies, but there is no eslint.config.js, so it
      # exits non-zero on any input. `tsc -b` inside the build is the type gate.
      - name: Type-check and build
        run: npm run build

      - name: Run unit tests
        run: npm run test:run

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Backend-free: frontend/e2e/mock-api.ts intercepts routes, and
      # playwright.config.ts starts the Vite dev server itself.
      - name: Run Playwright tests
        run: npm run test:e2e

  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ordinus_changed: ${{ steps.guard.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit present to diff the contract against it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e backend/

      # Moved here from docker.yml, where it only ran after a merge to main --
      # far too late to stop a stale spec reaching the branch.
      - name: Regenerate openapi.json
        run: python scripts/export_openapi.py

      - name: Fail if spec is stale
        run: git diff --exit-code openapi.json

      # Ordinus consumes exactly four Themis operations. Start its container only
      # when one of them, or a schema they reference, actually moved.
      - name: Check whether the Ordinus contract changed
        id: guard
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi

          if [ -z "$base" ]; then
            echo "no base commit to compare against; running the Ordinus test"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "$base:openapi.json" > /tmp/base-openapi.json 2>/dev/null || true
          before="$(python scripts/ordinus_contract.py /tmp/base-openapi.json)"
          after="$(python scripts/ordinus_contract.py openapi.json)"

          echo "base ($base): $before"
          echo "head:         $after"

          if [ "$before" = "$after" ]; then
            echo "Ordinus-consumed surface unchanged; skipping the 4th container."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ordinus-consumed surface changed; running the push profile."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: the e2e job loads it from this artifact, so a pull
      # request is tested against its own image without publishing anything.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: themis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save themis:ci -o /tmp/themis-ci.tar

      - uses: actions/upload-artifact@v4
        with:
          name: themis-ci-image
          path: /tmp/themis-ci.tar
          retention-days: 1

  # The Themis<->Laminus edge: 3 containers, against the contract-verified mock.
  e2e-core:
    needs: [image]
    uses: mgomezdev/concordia/.github/workflows/e2e.yml@main
    with:
      profile: core
      image_artifact: themis-ci-image
      themis_image: themis:ci
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The Ordinus->Themis edge: only when this change can actually affect it.
  # Not a required check, because a skipped required check is an awkward gate;
  # a failure here still turns the whole run red.
  e2e-push:
    needs: [image, spec]
    if: needs.spec.outputs.ordinus_changed == 'true'
    uses: mgomezdev/concordia/.github/workflows/e2e.yml@main
    with:
      profile: push
      image_artifact: themis-ci-image
      themis_image: themis:ci
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publishing lives here rather than in its own workflow so it can actually
  # depend on the tests. As two separate workflows there was no edge between
  # them, and a red suite still shipped an image.
  publish:
    needs: [backend, frontend, frontend-e2e, spec, image, e2e-core]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # attach openapi.json to the release on a tag
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dual-push during the migration so the printer host keeps pulling from
      # Docker Hub unchanged while CI moves to GHCR.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mgomezdev/themis
            ninjabuffalo/themis
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (mock)
        id: meta-mock
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mgomezdev/themis-mock
            ninjabuffalo/themis-mock
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push mock image
        uses: docker/build-push-action@v6
        with:
          context: mock
          push: true
          tags: ${{ steps.meta-mock.outputs.tags }}
          labels: ${{ steps.meta-mock.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach spec to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openapi.json
