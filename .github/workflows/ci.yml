name: ci

# Gates every feature/* -> develop pull request. Until this existed, none of the
# repo's backend, frontend or Playwright tests ran in CI at all -- the only
# workflow triggered on push to main, after the merge it should have gated.
#
# Cross-service coverage is delegated to Concordia's reusable e2e workflow, which
# runs inside this workflow run so its result blocks this pull request directly.

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
  # Manual run of the whole pipeline, including e2e-full, against any branch without opening a PR to main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether this run can affect anything the jobs below test. A pull request into develop that touches only
  # documentation (docs/**, *.md, LICENSE; not the docs the test suite reads, and not .claude/) sets code=false, and every test, image and e2e job is skipped:
  # no image build, no three-container e2e. Anything else runs the full pipeline: pushes, tags, manual runs, release
  # pull requests into main (e2e-full is their gate and must never be skipped), and any pull request with one
  # non-documentation file. When in doubt (no base commit, a failed diff) it runs everything.
  #
  # REQUIRED CHECKS: a skipped job reports "skipped", which a branch ruleset accepts for that job's own check. A check
  # produced INSIDE a called workflow (e.g. "e2e-core / e2e") is never created when its caller is skipped, so a ruleset
  # that requires it would leave a docs-only pull request waiting forever. Require the `gate` job at the bottom of
  # this file instead: it always runs, and is green only when every job it needs succeeded or was skipped.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" = "main" ]; then
            echo "Not a pull request into a non-release branch: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a code file renamed into docs/ must be listed under its old path too, or the diff looks docs-only.
          if ! files="$(git diff --name-only --no-renames "$BASE_SHA"...HEAD)"; then
            echo "Could not diff against $BASE_SHA: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code="$(printf '%s\n' "$files" | python3 scripts/ci_changed_code.py)"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  backend:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e "backend[dev]"

      # Rule set lives in backend/pyproject.toml ([tool.ruff.lint]).
      - name: Lint backend
        working-directory: backend
        run: ruff check .

      # No services needed: backend/tests/conftest.py runs against a per-test SQLite
      # file over an ASGI transport, so there is no DB server, network or sidecar.
      # --cov enforces the `fail_under` floor in backend/pyproject.toml ([tool.coverage.report]).
      # -n auto (pytest-xdist): one worker per core. Every test has its own database file and
      # tmp_path, so they are independent; measured 7m05s serial -> 2m33s on 4 cores with the
      # same 4001 passes and the same coverage. -v is off: 4000 PASSED lines bury the failure
      # that -ra already lists in full.
      - name: Run backend tests
        working-directory: backend
        run: pytest -ra -n auto --cov

  mcp-server:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      - run: pip install -e "mcp-server[dev]"

      # Fake Themis over an httpx MockTransport: no backend, network or MCP client needed.
      - name: Run MCP server tests
        working-directory: mcp-server
        run: pytest -v -ra

  frontend:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Errors fail the job. Warnings (react-refresh, exhaustive-deps) are a ratchet: `--max-warnings` in
      # package.json is the count on develop, so a new one fails; lower the number when you fix some.
      - name: Lint
        run: npm run lint

      # `tsc -b` inside the build is the type gate.
      - name: Type-check and build
        run: npm run build

      # Fails if coverage drops below the floors in vitest.config.ts.
      - name: Run unit tests
        run: npm run test:cov

  frontend-e2e:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The browser download is the slow half of `playwright install`; key it on the resolved
      # Playwright version so a dependency bump refetches it. The apt packages it needs are not
      # cacheable, so install-deps still runs on a hit.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Backend-free: frontend/e2e/mock-api.ts intercepts routes, and
      # playwright.config.ts starts the Vite dev server itself.
      - name: Run Playwright tests
        run: npm run test:e2e

  spec:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ordinus_changed: ${{ steps.guard.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit present to diff the contract against it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e backend/

      # Moved here from docker.yml, where it only ran after a merge to main --
      # far too late to stop a stale spec reaching the branch.
      - name: Regenerate openapi.json
        run: python scripts/export_openapi.py

      - name: Fail if spec is stale
        run: git diff --exit-code openapi.json

      # Ordinus consumes six Themis operations. Start its container only when one
      # of them, a schema they reference, or the module implementing them moved.
      #
      # The path filter is not redundant with the digest: those routes declare no
      # response_model, so their 200 bodies are untyped in openapi.json. Ordinus
      # reads fields that therefore appear nowhere in the spec, and renaming one
      # would not move the digest. Until the routes gain response models, a touch
      # of the route module is the only signal that exists.
      - name: Check whether the Ordinus contract changed
        id: guard
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "No base commit to compare against; running the Ordinus test."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git show "$base:openapi.json" > /tmp/base-openapi.json; then
            echo "Base spec unavailable; running the Ordinus test."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A non-zero exit here is a real failure, not a "no change" signal.
          before="$(python scripts/ordinus_contract.py /tmp/base-openapi.json)"
          after="$(python scripts/ordinus_contract.py openapi.json)"
          echo "base ($base): $before"
          echo "head:         $after"

          routes="$(git diff --name-only "$base"...HEAD -- \
            backend/app/api/routes/projects.py \
            backend/app/api/routes/files.py)"
          [ -n "$routes" ] && echo "consumed route modules touched:" && echo "$routes"

          if [ "$before" = "$after" ] && [ -z "$routes" ]; then
            echo "Ordinus-consumed surface unchanged; skipping the 4th container."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ordinus-consumed surface may have changed; running the push profile."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: the e2e job loads it from this artifact, so a pull
      # request is tested against its own image without publishing anything.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: themis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save themis:ci -o /tmp/themis-ci.tar

      - uses: actions/upload-artifact@v4
        with:
          name: themis-ci-image
          path: /tmp/themis-ci.tar
          retention-days: 1

  # The Themis<->Laminus edge: 3 containers, against the contract-verified mock.
  e2e-core:
    needs: [image]
    # A called workflow's token is capped by the caller's. Concordia's e2e logs
    # into GHCR with it, so state the grant here rather than inheriting a repo
    # default that may later tighten into an opaque login error in another repo.
    permissions:
      contents: read
      packages: read
    uses: mgomezdev/concordia/.github/workflows/e2e.yml@main
    with:
      profile: core
      image_artifact: themis-ci-image
      themis_image: themis:ci
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The Ordinus->Themis edge: only when this change can actually affect it.
  # Not a required check, because a skipped required check is an awkward gate;
  # a failure here still turns the whole run red.
  e2e-push:
    needs: [image, spec]
    if: needs.spec.outputs.ordinus_changed == 'true'
    permissions:
      contents: read
      packages: read
    uses: mgomezdev/concordia/.github/workflows/e2e.yml@main
    with:
      profile: push
      image_artifact: themis-ci-image
      themis_image: themis:ci
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The release gate: real Laminus, real OrcaSlicer, no mocks. Only runs on a
  # pull request targeting main -- i.e. a develop -> main release PR -- never
  # on a develop-targeting PR and never on push (or manually via workflow_dispatch,
  # which a ruleset never sees as a PR check). That is deliberate: it is what
  # lets a ruleset on this repo's main branch require this check without ever
  # seeing it skipped, which a check gated any other way would be.
  e2e-full:
    needs: [image]
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    permissions:
      contents: read
      packages: read
    uses: mgomezdev/concordia/.github/workflows/e2e-full.yml@main
    with:
      image_artifact: themis-ci-image
      themis_image: themis:ci
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publishing lives here rather than in its own workflow so it can actually
  # depend on the tests. As two separate workflows there was no edge between
  # them, and a red suite still shipped an image.
  publish:
    needs: [backend, frontend, frontend-e2e, spec, image, e2e-core, e2e-push]
    # e2e-push is skipped whenever the Ordinus surface did not move, so this
    # cannot use a plain `needs` success gate. Tolerate `skipped`, reject
    # `failure`. Naming a status function here drops the implicit success()
    # on every other need, so each one is listed explicitly.
    # Hyphenated job ids must use bracket notation: `needs.frontend-e2e` parses
    # as a subtraction, not a property lookup.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.backend.result == 'success'
      && needs.frontend.result == 'success'
      && needs['frontend-e2e'].result == 'success'
      && needs.spec.result == 'success'
      && needs.image.result == 'success'
      && needs['e2e-core'].result == 'success'
      && needs['e2e-push'].result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # attach openapi.json to the release on a tag
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dual-push during the migration so the printer host keeps pulling from
      # Docker Hub unchanged while CI moves to GHCR.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mgomezdev/themis
            ninjabuffalo/themis
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (mock)
        id: meta-mock
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mgomezdev/themis-mock
            ninjabuffalo/themis-mock
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push mock image
        uses: docker/build-push-action@v6
        with:
          context: mock
          push: true
          tags: ${{ steps.meta-mock.outputs.tags }}
          labels: ${{ steps.meta-mock.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach spec to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openapi.json

  # The one check a branch ruleset should require (see the note on `changes`). Always runs; fails if any job it needs
  # failed or was cancelled, passes when each succeeded or was skipped (a docs-only pull request, an unchanged Ordinus
  # surface, e2e-full outside a release pull request).
  gate:
    needs: [changes, backend, mcp-server, frontend, frontend-e2e, spec, image, e2e-core, e2e-push, e2e-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {job: n["result"] for job, n in needs.items() if n["result"] not in ("success", "skipped")}
          if needs["changes"]["result"] != "success":
              bad["changes"] = needs["changes"]["result"]     # the filter itself may never be skipped
          print("failed:", bad or "none")
          sys.exit(1 if bad else 0)
          PY
